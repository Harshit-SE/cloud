apiVersion: apps/v1
kind: Deployment
metadata:
  name: aeroparse
  namespace: app
  labels:
    app.kubernetes.io/name: aeroparse
    app.kubernetes.io/component: inference-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aeroparse
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: aeroparse
    spec:
      containers:
        - name: aeroparse
          image: aeroparse-service:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: MODEL_URI
              value: "s3://models/v1/pythia-70m-v1.tar.gz"
            - name: MODEL_VERSION
              value: "v1"
            - name: S3_ENDPOINT
              value: "http://seaweedfs-s3.data.svc.cluster.local:8333"
            - name: MAX_NEW_TOKENS
              value: "100"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-s3-credentials
                  key: access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-s3-credentials
                  key: secret-key
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 120
---
apiVersion: v1
kind: Service
metadata:
  name: aeroparse
  namespace: app
  labels:
    app.kubernetes.io/name: aeroparse
spec:
  selector:
    app: aeroparse
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aeroparse
  namespace: app
  labels:
    app.kubernetes.io/name: aeroparse
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /parse
            pathType: Prefix
            backend:
              service:
                name: aeroparse
                port:
                  number: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aeroparse
  namespace: app
  labels:
    app.kubernetes.io/name: aeroparse
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aeroparse
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
