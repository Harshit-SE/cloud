# ==============================================================================
# AeroParse k3d Cluster Topology Configuration
# Creates a lightweight single-node Kubernetes cluster with ingress loadbalancer
# ==============================================================================
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: aeroparse-cluster

servers: 1
agents: 0

ports:
  - port: 8080:80
    nodeFilters:
      - loadbalancer

options:
  k3d:
    wait: true
    timeout: "300s"
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
